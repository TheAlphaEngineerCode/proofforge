# Render blueprint for the public demo.
#
# ProofForge does run on Render (since 2026-07-24), but not from this file: the
# services were created one by one, so the blueprint itself is still unproven —
# treat the first blueprint deploy as its test.
#
# Everything here is on the free plan, and that is a deliberate ceiling rather
# than a starting point: this is a demonstration, and a blueprint anyone can
# deploy should not be able to start billing them. Two consequences are visible
# to whoever opens it. The services sleep after roughly 15 idle minutes, so the
# first request takes about 50 seconds. And there is no database: Render's free
# PostgreSQL expires 30 days after it is created, which would turn the demo into
# a link that breaks by itself on a date nobody remembers. Without DATABASE_URL
# the API runs on its in-memory store — a supported mode that says so in the
# logs — and nothing survives a restart. Losing demo data on redeploy is a
# smaller lie than a dead link, and a much smaller one than a surprise invoice.
#
# For a deployment that keeps its data, add a `databases:` entry on a paid plan
# and point DATABASE_URL at it with `fromDatabase`; the code path is the same
# one the PostgreSQL integration job exercises on every change.
#
# There is no Redis and no worker here either, so the API runs analyses
# in-process. That is also what the free plan allows — background workers have
# no free tier — and it is the mode ADR 0009 describes as the hosted one.
#
# Secrets are declared with `sync: false` so Render prompts for them rather than
# reading them from this file; nothing here should ever hold a credential.

services:
  - type: web
    name: proofforge-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    # The API depends on eight workspace packages, so the build context has to
    # be the repository root — the same reason the Dockerfiles say so.
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "3001"
      # No DATABASE_URL: see the note at the top of this file. The API falls
      # back to in-memory storage and logs that it has done so.
      # Set by hand, with the scheme. `fromService` can only yield a bare host
      # (`proofforge-web.onrender.com`), and this value is compared against the
      # browser's Origin header for CORS — an origin without https:// never
      # matches, so every dashboard request would be blocked.
      - key: WEB_BASE_URL
        sync: false
      # This service's own public origin, which GitHub returns the browser to.
      # `fromService` yields a bare host, and the callback must be a full URL.
      - key: API_BASE_URL
        sync: false
      # Absent until the GitHub App is registered; the API runs without it and
      # records webhook state instead of publishing.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      # Sign-in. Without these the deployment has no way in: dev-login is forced
      # off in production, so the dashboard would render a card and no button.
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      # Signs the OAuth state. Render generates it once and every instance of
      # the service reads the same value — which is the point: a per-process
      # secret makes logins fail whenever the callback lands on the other one.
      - key: AUTH_STATE_SECRET
        generateValue: true

  - type: web
    name: proofforge-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      # Same reason, and one more: this is baked into the client bundle at
      # build time, so it must be a full URL the browser can fetch, and a
      # change means a rebuild rather than a restart.
      - key: NEXT_PUBLIC_API_URL
        sync: false
