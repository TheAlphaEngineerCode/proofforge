name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Regenerate JSON Schema and check it is committed
        run: |
          pnpm --filter @proofforge/evidence-spec generate:schema
          git diff --exit-code -- packages/evidence-spec/schema/proof-manifest.schema.json

  postgres:
    name: Storage · PostgreSQL integration
    runs-on: ubuntu-latest
    # The in-memory backend is what every other job exercises. This one runs the
    # Drizzle backend against a real database, where column constraints, JSON
    # round-trips and timestamp formats are decided rather than assumed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: proofforge
          POSTGRES_DB: proofforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Through the same runner the API uses on startup, not a parallel psql
      # invocation: a schema applied one way and tested another proves nothing
      # about how production actually gets its tables.
      - name: Apply the schema
        env:
          DATABASE_URL: postgresql://postgres:proofforge@localhost:5432/proofforge
        run: pnpm --filter @proofforge/database db:migrate

      - name: Apply it again, to prove it is a no-op
        env:
          DATABASE_URL: postgresql://postgres:proofforge@localhost:5432/proofforge
        run: pnpm --filter @proofforge/database db:migrate

      - name: Run the storage tests against PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:proofforge@localhost:5432/proofforge
        run: pnpm --filter @proofforge/database test

  redis:
    name: Queue · Redis integration
    runs-on: ubuntu-latest
    # The in-memory queue is what every other job exercises. This one runs the
    # BullMQ backend against a real Redis, where job-id deduplication and pub/sub
    # delivery across connections are decided rather than assumed.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the queue tests against Redis
        env:
          TEST_REDIS_URL: redis://localhost:6379
        run: pnpm --filter @proofforge/queue test

  python:
    name: Python services · Ruff · mypy · pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [repository-analyzer, evidence-engine]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: mypy (strict)
        run: uv run mypy

      - name: pytest
        run: uv run pytest

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Gitleaks scans the range a push introduced, which means resolving the
          # parent of its first commit. The default shallow checkout does not have
          # it, so any push carrying more than one commit fails on a git error
          # rather than on a finding — a secret scanner that goes red for reasons
          # unrelated to secrets is one people learn to wave through.
          fetch-depth: 0

      - name: Gitleaks (event range)
        if: github.event_name != 'workflow_dispatch'
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Release Please uses workflow_dispatch because GitHub intentionally does
      # not trigger workflows from pull requests created with GITHUB_TOKEN. The
      # Gitleaks action treats manual dispatches as full-history scans, so scan
      # only the release branch delta here. Historical findings remain a
      # separate audit concern and cannot make a clean release draft look red.
      - name: Gitleaks (release branch range)
        if: github.event_name == 'workflow_dispatch'
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --log-opts="origin/main..HEAD" /repo

      - name: Trivy (filesystem vulnerability scan)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  images:
    name: Container images
    runs-on: ubuntu-latest
    # The images are how this ships, and nothing else in CI builds them. Their
    # dependency lists are maintained by hand, so a package added to an app and
    # not to its Dockerfile breaks only at deploy time — which is exactly how it
    # happened once. Building them here moves that failure back to the pull
    # request. Nothing is pushed: the build succeeding is the whole assertion.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  evidence:
    name: Evidence · this change, proved
    runs-on: ubuntu-latest
    # ProofForge's claim is that a change can carry verifiable evidence of
    # itself. Everywhere else that claim is tested against fixtures; here it is
    # made about this repository's own commits. The runner is the one place the
    # project has that can actually do it — the hosted instance has no Docker
    # daemon and no Python, so every manifest it emits is simulated and says so.
    #
    # The command builds the manifest with the Python engine and then verifies
    # it with the TypeScript library, so a green job means the two agree on the
    # hash. A collector that cannot run is reported as such and charged for by
    # the risk score; that is a finding about the change, not a broken build, so
    # only a manifest that fails to build or fails to verify fails this job.
    steps:
      # The engine diffs against the parent commit, which a depth-1 checkout
      # does not have.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.11.0
          cache: pnpm

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"

      # The collectors are looked up on PATH by name. Installing them is what
      # separates a manifest that measured something from one that reports four
      # unavailable collectors and a risk score inflated by their absence.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.0

      - name: Install Gitleaks and Semgrep
        # Same Gitleaks version the security job runs, so the two jobs cannot
        # disagree about what a secret is.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          uv tool install semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Test execution happens inside the published sandbox image, pulled
      # anonymously — repository code never runs on the runner itself.
      # Measure the commit, not the checkout. By this point the working tree also
      # holds `node_modules`, build output and the virtualenv `uv run` makes for
      # the engine — none of which is part of the change, all of which the sandbox
      # would copy into the container and install on top of. A worktree shares the
      # object store, so this costs nothing and `HEAD~1` still resolves.
      - name: Take a clean copy of the commit
        run: git worktree add ../clean HEAD

      - name: Build and verify a proof-manifest for this commit
        env:
          # The sandbox installs the repository's dependencies before it can run a
          # single test, and the 300s default is spent well before that finishes —
          # the collector would report `timeout` on every run and measure nothing.
          PROOFFORGE_TOOL_TIMEOUT_S: "1800"
        run: node packages/cli/dist/index.js evidence build ../clean --output-dir ./bundle

      - name: Publish the bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: proof-manifest-${{ github.sha }}
          path: ./bundle
          if-no-files-found: warn
